{% extends "base.html" %}{% block content %}<div class="mx-auto max-w-2xl"><h1 class="text-2xl font-bold">{{ quiz.title }}</h1><form method="post" class="mt-6 space-y-3 rounded bg-white p-6 shadow"><textarea required name="text" placeholder="Question" class="w-full rounded border p-2"></textarea>{% for x in 'abcd' %}<input required name="option_{{ x }}" placeholder="Option {{ x|upper }}" class="w-full rounded border p-2">{% endfor %}<select name="correct_option">{% for x in 'ABCD' %}<option>{{ x }}</option>{% endfor %}</select><button class="block rounded bg-teal-700 px-4 py-2 text-white">Add question</button></form><ol class="mt-4 list-decimal pl-5">{% for q in quiz.questions %}<li>{{ q.text }}</li>{% endfor %}</ol></div>{% endblock %}
