{% extends "base.html" %}{% block content %}<div class="mx-auto max-w-2xl"><h1 class="text-3xl font-bold">{{ quiz.title }}</h1><form method="post" class="mt-6 space-y-5">{% for q in quiz.questions %}<fieldset class="rounded bg-white p-5 shadow"><legend class="font-bold">{{ loop.index }}. {{ q.text }}</legend>{% for letter, value in [('A',q.option_a),('B',q.option_b),('C',q.option_c),('D',q.option_d)] %}<label class="mt-2 block"><input required type="radio" name="question_{{ q.id }}" value="{{ letter }}"> {{ letter }}. {{ value }}</label>{% endfor %}</fieldset>{% endfor %}<button class="rounded bg-teal-700 px-5 py-3 text-white">Submit quiz</button></form></div>{% endblock %}
